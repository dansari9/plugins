name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux VST3 + Standalone
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libgtk-3-dev

      - name: Configure
        working-directory: SpringReverb
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, Standalone, and the impulse-response tool
        working-directory: SpringReverb
        run: cmake --build build --parallel --target SpringTank_VST3 SpringTank_Standalone SpringTankIRTest

      - name: Render and check the impulse response
        working-directory: SpringReverb
        run: ./build/SpringTankIRTest artifacts/spring_tank_impulse.wav

      - name: Upload plug-ins and impulse response
        uses: actions/upload-artifact@v4
        with:
          name: spring-tank-linux
          if-no-files-found: error
          path: |
            SpringReverb/build/SpringTank_artefacts/Release/VST3/**
            SpringReverb/build/SpringTank_artefacts/Release/Standalone/**
            SpringReverb/artifacts/spring_tank_impulse.wav

  macos:
    name: macOS AU + VST3
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: SpringReverb
        run: cmake -S . -B build -G Xcode

      - name: Build AU, VST3, and the impulse-response tool
        working-directory: SpringReverb
        run: cmake --build build --config Release --parallel --target SpringTank_AU SpringTank_VST3 SpringTankIRTest

      - name: Render and check the impulse response
        working-directory: SpringReverb
        run: |
          BIN="$(find build -type f -name SpringTankIRTest -perm +111 | head -n 1)"
          test -n "$BIN"
          mkdir -p artifacts
          "$BIN" artifacts/spring_tank_impulse.wav

      - name: Upload AU, VST3, and impulse response
        uses: actions/upload-artifact@v4
        with:
          name: spring-tank-macos
          if-no-files-found: error
          path: |
            SpringReverb/build/SpringTank_artefacts/Release/AU/**
            SpringReverb/build/SpringTank_artefacts/Release/VST3/**
            SpringReverb/artifacts/spring_tank_impulse.wav

  crumb-linux:
    name: Crumb Linux VST3 + tests + pluginval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config xvfb unzip \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libgtk-3-dev

      - name: Configure
        run: cmake -S Crumb -B Crumb/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Crumb/build --parallel --target Crumb_VST3 Crumb_Standalone CrumbTests

      - name: Unit tests
        run: xvfb-run -a Crumb/build/CrumbTests

      - name: Unit tests under ASan + UBSan
        run: |
          S="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake -S Crumb -B Crumb/build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=$S" "-DCMAKE_CXX_FLAGS=$S" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          cmake --build Crumb/build-asan --parallel 2 --target CrumbTests
          xvfb-run -a Crumb/build-asan/CrumbTests

      - name: pluginval (strictness 10)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            --validate Crumb/build/Crumb_artefacts/Release/VST3/Crumb.vst3

      - name: Package (tar keeps the executable bit)
        run: tar -C Crumb/build/Crumb_artefacts/Release -czf crumb-linux.tar.gz VST3 Standalone

      - name: Upload VST3 + Standalone
        uses: actions/upload-artifact@v4
        with:
          name: crumb-linux
          if-no-files-found: error
          path: crumb-linux.tar.gz

  crumb-macos:
    name: Crumb macOS universal AU + VST3 + auval
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S Crumb -B Crumb/build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build AU, VST3, tests
        run: cmake --build Crumb/build --config Release --parallel --target Crumb_AU Crumb_VST3 CrumbTests

      - name: Ad-hoc sign and verify AU and VST3
        run: |
          codesign --force --sign - --timestamp=none Crumb/build/Crumb_artefacts/Release/AU/Crumb.component
          codesign --verify --deep --strict --verbose=2 Crumb/build/Crumb_artefacts/Release/AU/Crumb.component
          codesign --force --sign - --timestamp=none Crumb/build/Crumb_artefacts/Release/VST3/Crumb.vst3
          codesign --verify --deep --strict --verbose=2 Crumb/build/Crumb_artefacts/Release/VST3/Crumb.vst3

      - name: Unit tests
        run: |
          BIN="$(find Crumb/build -type f -name CrumbTests -perm +111 | head -n 1)"
          test -n "$BIN"
          "$BIN"

      - name: Universal binary check
        run: |
          lipo -archs Crumb/build/Crumb_artefacts/Release/AU/Crumb.component/Contents/MacOS/Crumb | tee /dev/stderr | grep -q "x86_64 arm64"
          lipo -archs Crumb/build/Crumb_artefacts/Release/VST3/Crumb.vst3/Contents/MacOS/Crumb | grep -q "x86_64 arm64"

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R Crumb/build/Crumb_artefacts/Release/AU/Crumb.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i Dwks || true
          auval -v aufx Crmb Dwks

      - name: Package (zip keeps bundle permissions)
        run: cd Crumb/build/Crumb_artefacts/Release && ditto -c -k --keepParent AU/Crumb.component "$GITHUB_WORKSPACE/Crumb-AU-macos.zip" && ditto -c -k --keepParent VST3/Crumb.vst3 "$GITHUB_WORKSPACE/Crumb-VST3-macos.zip"

      - name: Upload AU + VST3
        uses: actions/upload-artifact@v4
        with:
          name: crumb-macos-universal
          if-no-files-found: error
          path: |
            Crumb-AU-macos.zip
            Crumb-VST3-macos.zip
