name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux VST3 + Standalone
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libgtk-3-dev

      - name: Configure
        working-directory: SpringReverb
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, Standalone, and the impulse-response tool
        working-directory: SpringReverb
        run: cmake --build build --parallel --target SpringTank_VST3 SpringTank_Standalone SpringTankIRTest

      - name: Render and check the impulse response
        working-directory: SpringReverb
        run: ./build/SpringTankIRTest artifacts/spring_tank_impulse.wav

      - name: Upload plug-ins and impulse response
        uses: actions/upload-artifact@v4
        with:
          name: spring-tank-linux
          if-no-files-found: error
          path: |
            SpringReverb/build/SpringTank_artefacts/Release/VST3/**
            SpringReverb/build/SpringTank_artefacts/Release/Standalone/**
            SpringReverb/artifacts/spring_tank_impulse.wav

  macos:
    name: macOS AU + VST3
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: SpringReverb
        run: cmake -S . -B build -G Xcode

      - name: Build AU, VST3, and the impulse-response tool
        working-directory: SpringReverb
        run: cmake --build build --config Release --parallel --target SpringTank_AU SpringTank_VST3 SpringTankIRTest

      - name: Render and check the impulse response
        working-directory: SpringReverb
        run: |
          BIN="$(find build -type f -name SpringTankIRTest -perm +111 | head -n 1)"
          test -n "$BIN"
          mkdir -p artifacts
          "$BIN" artifacts/spring_tank_impulse.wav

      - name: Upload AU, VST3, and impulse response
        uses: actions/upload-artifact@v4
        with:
          name: spring-tank-macos
          if-no-files-found: error
          path: |
            SpringReverb/build/SpringTank_artefacts/Release/AU/**
            SpringReverb/build/SpringTank_artefacts/Release/VST3/**
            SpringReverb/artifacts/spring_tank_impulse.wav

  silt-linux:
    name: Silt Linux VST3 + tests + pluginval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config xvfb unzip \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libgtk-3-dev

      - name: Configure (warnings are errors)
        run: cmake -S Silt -B Silt/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build Silt/build --parallel --target Silt_VST3 Silt_Standalone SiltTests

      - name: Unit tests
        run: xvfb-run -a Silt/build/SiltTests

      - name: Unit tests under ASan + UBSan
        run: |
          S="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake -S Silt -B Silt/build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=$S" "-DCMAKE_CXX_FLAGS=$S" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          cmake --build Silt/build-asan --parallel 2 --target SiltTests
          xvfb-run -a Silt/build-asan/SiltTests

      - name: pluginval 1.0.4 (strictness 10)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            --validate Silt/build/Silt_artefacts/Release/VST3/silt.vst3

      - name: Package (tar keeps the executable bit)
        run: tar -C Silt/build/Silt_artefacts/Release -czf silt-linux.tar.gz VST3 Standalone

      - name: Upload VST3 + Standalone
        uses: actions/upload-artifact@v4
        with:
          name: silt-linux
          if-no-files-found: error
          path: silt-linux.tar.gz

  silt-macos:
    name: Silt macOS universal AU + VST3 + auval
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S Silt -B Silt/build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build AU, VST3, tests
        run: cmake --build Silt/build --config Release --parallel --target Silt_AU Silt_VST3 SiltTests

      - name: Ad-hoc sign and verify AU and VST3
        run: |
          codesign --force --sign - --timestamp=none Silt/build/Silt_artefacts/Release/AU/silt.component
          codesign --verify --deep --strict --verbose=2 Silt/build/Silt_artefacts/Release/AU/silt.component
          codesign --force --sign - --timestamp=none Silt/build/Silt_artefacts/Release/VST3/silt.vst3
          codesign --verify --deep --strict --verbose=2 Silt/build/Silt_artefacts/Release/VST3/silt.vst3

      - name: Unit tests
        run: |
          BIN="$(find Silt/build -type f -name SiltTests -perm +111 | head -n 1)"
          test -n "$BIN"
          "$BIN"
          arch -x86_64 "$BIN" --core

      - name: Universal binary check
        run: |
          lipo Silt/build/Silt_artefacts/Release/AU/silt.component/Contents/MacOS/silt -verify_arch arm64 x86_64
          lipo Silt/build/Silt_artefacts/Release/VST3/silt.vst3/Contents/MacOS/silt -verify_arch arm64 x86_64

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R Silt/build/Silt_artefacts/Release/AU/silt.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i Dwks || true
          auval -v aumf Silt Dwks

      - name: pluginval 1.0.4 (strictness 10, AU + VST3)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --validate-in-process --validate ~/Library/Audio/Plug-Ins/Components/silt.component
          $PV --strictness-level 10 --validate-in-process --validate Silt/build/Silt_artefacts/Release/VST3/silt.vst3

      - name: Package (zip keeps bundle permissions)
        run: cd Silt/build/Silt_artefacts/Release && ditto -c -k --keepParent AU/silt.component "$GITHUB_WORKSPACE/Silt-AU-macos.zip" && ditto -c -k --keepParent VST3/silt.vst3 "$GITHUB_WORKSPACE/Silt-VST3-macos.zip"

      - name: Upload AU + VST3
        uses: actions/upload-artifact@v4
        with:
          name: silt-macos-universal
          if-no-files-found: error
          path: |
            Silt-AU-macos.zip
            Silt-VST3-macos.zip

  gulp-linux:
    name: Gulp Linux VST3 + tests + pluginval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config xvfb unzip \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libgtk-3-dev

      - name: Configure
        run: cmake -S Gulp -B Gulp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Gulp/build --parallel --target Gulp_VST3 Gulp_Standalone GulpTests

      - name: Unit tests
        run: xvfb-run -a Gulp/build/GulpTests

      - name: Unit tests under ASan + UBSan
        run: |
          S="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake -S Gulp -B Gulp/build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=$S" "-DCMAKE_CXX_FLAGS=$S" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          cmake --build Gulp/build-asan --parallel 2 --target GulpTests
          xvfb-run -a Gulp/build-asan/GulpTests

      - name: pluginval (strictness 10)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            --validate Gulp/build/Gulp_artefacts/Release/VST3/gulp.vst3

      - name: Package (tar keeps the executable bit)
        run: tar -C Gulp/build/Gulp_artefacts/Release -czf gulp-linux.tar.gz VST3 Standalone

      - name: Upload VST3 + Standalone
        uses: actions/upload-artifact@v4
        with:
          name: gulp-linux
          if-no-files-found: error
          path: gulp-linux.tar.gz

  gulp-macos:
    name: Gulp macOS universal AU + VST3 + auval
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S Gulp -B Gulp/build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build AU, VST3, tests
        run: cmake --build Gulp/build --config Release --parallel --target Gulp_AU Gulp_VST3 GulpTests

      - name: Ad-hoc sign and verify AU and VST3
        run: |
          codesign --force --sign - --timestamp=none Gulp/build/Gulp_artefacts/Release/AU/gulp.component
          codesign --verify --deep --strict --verbose=2 Gulp/build/Gulp_artefacts/Release/AU/gulp.component
          codesign --force --sign - --timestamp=none Gulp/build/Gulp_artefacts/Release/VST3/gulp.vst3
          codesign --verify --deep --strict --verbose=2 Gulp/build/Gulp_artefacts/Release/VST3/gulp.vst3

      - name: Unit tests
        run: |
          BIN="$(find Gulp/build -type f -name GulpTests -perm +111 | head -n 1)"
          test -n "$BIN"
          "$BIN"

      - name: Universal binary check
        run: |
          lipo Gulp/build/Gulp_artefacts/Release/AU/gulp.component/Contents/MacOS/gulp -verify_arch arm64 x86_64
          lipo Gulp/build/Gulp_artefacts/Release/VST3/gulp.vst3/Contents/MacOS/gulp -verify_arch arm64 x86_64

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R Gulp/build/Gulp_artefacts/Release/AU/gulp.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i Dwks || true
          auval -v aumf Gulp Dwks

      - name: pluginval (strictness 10, AU + VST3)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --validate-in-process --validate ~/Library/Audio/Plug-Ins/Components/gulp.component
          $PV --strictness-level 10 --validate-in-process --validate Gulp/build/Gulp_artefacts/Release/VST3/gulp.vst3

      - name: Package (zip keeps bundle permissions)
        run: cd Gulp/build/Gulp_artefacts/Release && ditto -c -k --keepParent AU/gulp.component "$GITHUB_WORKSPACE/Gulp-AU-macos.zip" && ditto -c -k --keepParent VST3/gulp.vst3 "$GITHUB_WORKSPACE/Gulp-VST3-macos.zip"

      - name: Upload AU + VST3
        uses: actions/upload-artifact@v4
        with:
          name: gulp-macos-universal
          if-no-files-found: error
          path: |
            Gulp-AU-macos.zip
            Gulp-VST3-macos.zip
